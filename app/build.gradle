plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("YTSC_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("YTSC_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("YTSC_KEY_ALIAS")
def releaseKeyPassword = System.getenv("YTSC_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.personal.youtubescriptcopy"
    compileSdk 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.personal.youtubescriptcopy.reinstall"
        minSdk 23
        targetSdk 36
        versionCode 14
        versionName "1.3.7"
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
