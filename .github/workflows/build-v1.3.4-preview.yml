name: Build v1.3.7 Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "README.md"
      - ".github/workflows/build-v1.3.4-preview.yml"

concurrency:
  group: build-v1.3.7-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_RELEASE_TAG: v1.3.3
      SIGNING_ASSET_RELEASE_TAG: v1.2.1
      PREVIOUS_APK_NAME: YouTubeScriptCopy-1.3.3.apk
      APK_NAME: YouTubeScriptCopy-1.3.7.apk
      APK_PACKAGE: com.personal.youtubescriptcopy.reinstall
      APK_VERSION_CODE: "14"
      APK_VERSION_NAME: "1.3.7"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Recover stable release signing credentials
        run: |
          set -euo pipefail
          gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PREVIOUS_APK_NAME"
          gh release download "$SIGNING_ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "internal-ytsc-release.jks"
          gh release download "$SIGNING_ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "internal-ytsc-release-key.txt"
          chmod 600 internal-ytsc-release.jks internal-ytsc-release-key.txt

      - name: Test and build signed APK
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'buildConfigField.*GEMINI|gemini\.apiKey|BuildConfig\.GEMINI_API_KEY' app/src/main app/build.gradle
          grep -R --line-number 'gemini-3.5-flash-lite' app/src/main/java/com/personal/youtubescriptcopy/GeminiInteractionsClient.java
          ! grep -R --line-number 'gemini-3.1-flash-lite' app/src/main app/build.gradle
          grep -R --line-number 'Intent.ACTION_SEND' app/src/main/java/com/personal/youtubescriptcopy/AppSelectionActivity.java
          grep -R --line-number 'Intent.EXTRA_TEXT' app/src/main/java/com/personal/youtubescriptcopy/AppSelectionActivity.java
          grep -R --line-number 'ShareConfigurationActivity.class' app/src/main/java/com/personal/youtubescriptcopy/AppSelectionActivity.java
          grep -R --line-number 'ShareConfigurationActivity.class' app/src/main/java/com/personal/youtubescriptcopy/SettingsActivity.java
          grep -R --line-number 'launchModeConfigured' app/src/main/java/com/personal/youtubescriptcopy/AppSelectionActivity.java
          grep -R --line-number 'android:taskAffinity=""' app/src/main/AndroidManifest.xml
          grep -R --line-number 'android:excludeFromRecents="true"' app/src/main/AndroidManifest.xml
          grep -R --line-number 'Theme.YouTubeScriptCopy.Transparent' app/src/main/AndroidManifest.xml
          grep -R --line-number 'android.intent.action.SEND' app/src/main/AndroidManifest.xml
          ! grep -R --line-number 'getLaunchIntentForPackage' app/src/main/java/com/personal/youtubescriptcopy

          STORE_PASSWORD="$(sed -n 's/^YTSC_KEYSTORE_PASSWORD=//p' internal-ytsc-release-key.txt)"
          KEY_ALIAS="$(sed -n 's/^YTSC_KEY_ALIAS=//p' internal-ytsc-release-key.txt)"
          KEY_PASSWORD="$(sed -n 's/^YTSC_KEY_PASSWORD=//p' internal-ytsc-release-key.txt)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          export YTSC_KEYSTORE_PATH="$GITHUB_WORKSPACE/internal-ytsc-release.jks"
          export YTSC_KEYSTORE_PASSWORD="$STORE_PASSWORD"
          export YTSC_KEY_ALIAS="$KEY_ALIAS"
          export YTSC_KEY_PASSWORD="$KEY_PASSWORD"

          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify update compatibility
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS_APK_NAME" \
            | tee previous-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" \
            | tee apk-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt

          PREVIOUS_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' previous-signature.txt | head -n 1)"
          NEW_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' apk-signature.txt | head -n 1)"
          test -n "$PREVIOUS_CERT"
          test "$PREVIOUS_CERT" = "$NEW_CERT"

          "$AAPT" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -q "package: name='$APK_PACKAGE'" apk-badging.txt
          grep -q "versionCode='$APK_VERSION_CODE'" apk-badging.txt
          grep -q "versionName='$APK_VERSION_NAME'" apk-badging.txt
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" > YouTubeScriptCopy-1.3.7.sha256

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f internal-ytsc-release.jks internal-ytsc-release-key.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeScriptCopy-1.3.7-preview
          path: |
            YouTubeScriptCopy-1.3.7.apk
            YouTubeScriptCopy-1.3.7.sha256
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
