name: Publish v1.3.1

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "README.md"
      - ".github/workflows/publish-v1.3.1.yml"

concurrency:
  group: publish-v1.3.1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.3.1
      PREVIOUS_RELEASE_TAG: v1.3.0
      SIGNING_ASSET_RELEASE_TAG: v1.2.1
      PREVIOUS_APK_NAME: YouTubeScriptCopy-1.3.0.apk
      APK_NAME: YouTubeScriptCopy-1.3.1.apk
      SOURCE_NAME: youtube-script-copy-android-v1.3.1-source.zip
      APK_PACKAGE: com.personal.youtubescriptcopy.reinstall
      APK_VERSION_CODE: "8"
      APK_VERSION_NAME: "1.3.1"
      RELEASE_TARGET_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check release state
        id: release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        if: steps.release.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.release.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Recover stable release signing credentials
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PREVIOUS_APK_NAME"
          gh release download "$SIGNING_ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "internal-ytsc-release.jks"
          gh release download "$SIGNING_ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "internal-ytsc-release-key.txt"
          chmod 600 internal-ytsc-release.jks internal-ytsc-release-key.txt

      - name: Test and build signed release
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'buildConfigField.*GEMINI|gemini\.apiKey|BuildConfig\.GEMINI_API_KEY' app/src/main app/build.gradle

          STORE_PASSWORD="$(sed -n 's/^YTSC_KEYSTORE_PASSWORD=//p' internal-ytsc-release-key.txt)"
          KEY_ALIAS="$(sed -n 's/^YTSC_KEY_ALIAS=//p' internal-ytsc-release-key.txt)"
          KEY_PASSWORD="$(sed -n 's/^YTSC_KEY_PASSWORD=//p' internal-ytsc-release-key.txt)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          export YTSC_KEYSTORE_PATH="$GITHUB_WORKSPACE/internal-ytsc-release.jks"
          export YTSC_KEYSTORE_PASSWORD="$STORE_PASSWORD"
          export YTSC_KEY_ALIAS="$KEY_ALIAS"
          export YTSC_KEY_PASSWORD="$KEY_PASSWORD"

          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify update-compatible APK
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS_APK_NAME" \
            | tee previous-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" \
            | tee new-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' new-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' new-signature.txt

          PREVIOUS_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' previous-signature.txt | head -n 1)"
          NEW_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' new-signature.txt | head -n 1)"
          test -n "$PREVIOUS_CERT"
          test "$PREVIOUS_CERT" = "$NEW_CERT"

          "$AAPT" dump badging "$APK_NAME" > apk-badging.txt
          grep -q "package: name='$APK_PACKAGE'" apk-badging.txt
          grep -q "versionCode='$APK_VERSION_CODE'" apk-badging.txt
          grep -q "versionName='$APK_VERSION_NAME'" apk-badging.txt
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" > YouTubeScriptCopy-1.3.1.sha256

      - name: Prepare release notes and source backup
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git archive --format=zip --output="$SOURCE_NAME" "$RELEASE_TARGET_SHA"
          cat > release-notes.md <<'EOF'
          v1.3.1은 완료 알림의 **앱 열기** 버튼을 누른 뒤에도 알림이 남아 있던 문제를 수정합니다.

          - 앱 선택 화면이 시작되는 즉시 완료 알림을 명시적으로 취소합니다.
          - 저장된 앱을 바로 여는 경우와 매번 앱을 선택하는 경우 모두 동일하게 알림이 제거됩니다.
          - 패키지명과 정식 서명 인증서를 v1.3.0과 동일하게 유지하고 versionCode를 8로 올려 기존 앱을 삭제하지 않고 업데이트할 수 있습니다.
          EOF

      - name: Create GitHub release
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$APK_NAME" YouTubeScriptCopy-1.3.1.sha256 "$SOURCE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "YouTube Script Copy 1.3.1" \
            --notes-file release-notes.md

      - name: Read back and verify release
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          rm -rf /tmp/release-readback
          mkdir -p /tmp/release-readback
          cd /tmp/release-readback
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "YouTubeScriptCopy-1.3.1.sha256"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_NAME"
          sha256sum --check --strict YouTubeScriptCopy-1.3.1.sha256
          unzip -t "$SOURCE_NAME" >/dev/null

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" \
            | tee "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          grep -q 'Verified using v1 scheme (JAR signing): true' \
            "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          "$AAPT" dump badging "$APK_NAME" > "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "package: name='$APK_PACKAGE'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "versionCode='$APK_VERSION_CODE'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "versionName='$APK_VERSION_NAME'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          unzip -t "$APK_NAME" >/dev/null

          cp "$APK_NAME" "$GITHUB_WORKSPACE/$APK_NAME"
          cp YouTubeScriptCopy-1.3.1.sha256 "$GITHUB_WORKSPACE/YouTubeScriptCopy-1.3.1.sha256"
          cp "$SOURCE_NAME" "$GITHUB_WORKSPACE/$SOURCE_NAME"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url \
            > "$GITHUB_WORKSPACE/release-readback.json"

      - name: Remove signing credentials
        if: always() && steps.release.outputs.exists == 'false'
        run: |
          rm -f internal-ytsc-release.jks internal-ytsc-release-key.txt

      - name: Upload verified release evidence
        if: steps.release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeScriptCopy-1.3.1-release
          path: |
            YouTubeScriptCopy-1.3.1.apk
            YouTubeScriptCopy-1.3.1.sha256
            apk-signature-readback.txt
            apk-badging-readback.txt
            release-readback.json
            youtube-script-copy-android-v1.3.1-source.zip
          if-no-files-found: error
          retention-days: 30
