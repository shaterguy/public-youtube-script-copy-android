name: Bootstrap verified Gradle wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-gradle-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Gradle 8.11.1 wrapper binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar
          actual="$(git hash-object gradle/wrapper/gradle-wrapper.jar)"
          expected="a4b76b9530d66f5e68d973ea569d8e19de379189"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Commit verified wrapper binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git commit -m "Bootstrap verified Gradle wrapper binary"
          git push
