name: Publish v1.3.7

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "README.md"
      - ".github/workflows/publish-v1.3.7.yml"
  workflow_dispatch:

concurrency:
  group: publish-v1.3.7
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: v1.3.7
  APK_NAME: YouTubeScriptCopy-1.3.7.apk
  CHECKSUM_NAME: YouTubeScriptCopy-1.3.7.sha256
  SOURCE_NAME: youtube-script-copy-android-v1.3.7-source.zip
  APK_PACKAGE: com.personal.youtubescriptcopy.reinstall
  APK_VERSION_CODE: "14"
  APK_VERSION_NAME: "1.3.7"
  EXPECTED_PUBLIC_CERT_SHA256: 'eb205a6db2ce0b8aa5bd5804069d1a5c62be1a9fb5140a655737384f195f4d8e'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_BUNDLE_BASE64: ${{ secrets.YOUTUBE_PUBLIC_SIGNING_BUNDLE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent public signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE_BASE64"
          rm -rf /tmp/public-signing
          mkdir -p /tmp/public-signing
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/public-signing/bundle.tar.gz
          tar -xzf /tmp/public-signing/bundle.tar.gz -C /tmp/public-signing
          test -s /tmp/public-signing/key.pk8
          test -s /tmp/public-signing/cert.pem
          ACTUAL="$(openssl x509 -in /tmp/public-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$EXPECTED_PUBLIC_CERT_SHA256"

      - name: Test and build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'buildConfigField.*GEMINI|gemini\.apiKey|BuildConfig\.GEMINI_API_KEY' app/src/main app/build.gradle
          grep -R --line-number 'gemini-3.5-flash-lite' app/src/main/java/com/personal/youtubescriptcopy/GeminiInteractionsClient.java
          ! grep -R --line-number 'gemini-3.1-flash-lite' app/src/main app/build.gradle
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Sign and verify persistent public APK
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/public-signing' EXIT
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          test -n "$AAPT"
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$APKSIGNER" sign \
            --key /tmp/public-signing/key.pk8 \
            --cert /tmp/public-signing/cert.pem \
            --out "$APK_NAME" \
            app-aligned.apk
          rm app-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee apk-signature.txt
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" apk-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt
          "$AAPT" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -q "package: name='$APK_PACKAGE'" apk-badging.txt
          grep -q "versionCode='$APK_VERSION_CODE'" apk-badging.txt
          grep -q "versionName='$APK_VERSION_NAME'" apk-badging.txt
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" > "$CHECKSUM_NAME"

      - name: Prepare release notes and source archive
        run: |
          set -euo pipefail
          git archive --format=zip --output="$SOURCE_NAME" "$GITHUB_SHA"
          cat > release-notes.md <<'EOF'
          v1.3.7 공개 저장소 서명 기준선입니다.

          - 기존 비공개판을 사용 중이면 기존 앱을 삭제한 뒤 이 공개판을 설치해야 합니다.
          - 이 공개판 이후의 버전은 같은 공개 서명키를 계속 사용하므로 덮어쓰기 업데이트가 가능합니다.
          - 전사 완료 후 스크립트를 선택 앱에 텍스트로 공유합니다.
          - Gemini API 키는 APK에 포함하지 않고 사용자가 앱에서 직접 입력합니다.
          EOF

      - name: Recreate GitHub release
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "$APK_NAME" "$CHECKSUM_NAME" "$SOURCE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "YouTube Script Copy 1.3.7" \
            --notes-file release-notes.md

      - name: Read back and verify release
        run: |
          set -euo pipefail
          rm -rf /tmp/release-readback
          mkdir -p /tmp/release-readback
          cd /tmp/release-readback
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CHECKSUM_NAME"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_NAME"
          sha256sum --check --strict "$CHECKSUM_NAME"
          unzip -t "$SOURCE_NAME" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          "$AAPT" dump badging "$APK_NAME" > "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "package: name='$APK_PACKAGE'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "versionCode='$APK_VERSION_CODE'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "versionName='$APK_VERSION_NAME'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          cp "$APK_NAME" "$GITHUB_WORKSPACE/$APK_NAME"
          cp "$CHECKSUM_NAME" "$GITHUB_WORKSPACE/$CHECKSUM_NAME"
          cp "$SOURCE_NAME" "$GITHUB_WORKSPACE/$SOURCE_NAME"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url \
            > "$GITHUB_WORKSPACE/release-readback.json"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeScriptCopy-1.3.7-release
          path: |
            YouTubeScriptCopy-1.3.7.apk
            YouTubeScriptCopy-1.3.7.sha256
            apk-signature-readback.txt
            apk-badging-readback.txt
            release-readback.json
            youtube-script-copy-android-v1.3.7-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record public release self-test
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/release-selftest-report.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "run_id": "$GITHUB_RUN_ID",
            "source_sha": "$GITHUB_SHA",
            "release_tag": "$RELEASE_TAG",
            "mode": "persistent-public-signing",
            "public_certificate_sha256": "$EXPECTED_PUBLIC_CERT_SHA256",
            "unit_tests": "success",
            "signed_apk": "verified",
            "release_readback": "verified",
            "private_to_public_reinstall_required": true,
            "future_public_updates_supported": true,
            "external_private_repo_dependency": false,
            "repository_secrets_required": true,
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-selftest-report.json
          git commit -m 'Record public release self-test'
          git push
