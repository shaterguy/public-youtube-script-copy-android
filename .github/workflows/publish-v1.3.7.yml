name: Publish v1.3.7

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "README.md"
      - ".github/workflows/publish-v1.3.7.yml"

concurrency:
  group: publish-v1.3.7
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.3.7
      PREVIOUS_RELEASE_TAG: v1.3.3
      SIGNING_ASSET_RELEASE_TAG: v1.2.1
      PREVIOUS_APK_NAME: YouTubeScriptCopy-1.3.3.apk
      APK_NAME: YouTubeScriptCopy-1.3.7.apk
      CHECKSUM_NAME: YouTubeScriptCopy-1.3.7.sha256
      SOURCE_NAME: youtube-script-copy-android-v1.3.7-source.zip
      APK_PACKAGE: com.personal.youtubescriptcopy.reinstall
      APK_VERSION_CODE: "14"
      APK_VERSION_NAME: "1.3.7"
      RELEASE_TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Check release state
        id: release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        if: steps.release.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.release.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Recover stable release signing credentials
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PREVIOUS_APK_NAME"
          gh release download "$SIGNING_ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "internal-ytsc-release.jks"
          gh release download "$SIGNING_ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "internal-ytsc-release-key.txt"
          chmod 600 internal-ytsc-release.jks internal-ytsc-release-key.txt

      - name: Test and build signed release
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'buildConfigField.*GEMINI|gemini\.apiKey|BuildConfig\.GEMINI_API_KEY' app/src/main app/build.gradle
          grep -R --line-number 'gemini-3.5-flash-lite' app/src/main/java/com/personal/youtubescriptcopy/GeminiInteractionsClient.java
          ! grep -R --line-number 'gemini-3.1-flash-lite' app/src/main app/build.gradle
          grep -R --line-number 'Intent.ACTION_SEND' app/src/main/java/com/personal/youtubescriptcopy/AppSelectionActivity.java
          grep -R --line-number 'Intent.EXTRA_TEXT' app/src/main/java/com/personal/youtubescriptcopy/AppSelectionActivity.java
          grep -R --line-number 'ShareConfigurationActivity' app/src/main/AndroidManifest.xml
          grep -R --line-number 'taskAffinity=""' app/src/main/AndroidManifest.xml
          ! grep -R --line-number 'getLaunchIntentForPackage' app/src/main/java/com/personal/youtubescriptcopy

          STORE_PASSWORD="$(sed -n 's/^YTSC_KEYSTORE_PASSWORD=//p' internal-ytsc-release-key.txt)"
          KEY_ALIAS="$(sed -n 's/^YTSC_KEY_ALIAS=//p' internal-ytsc-release-key.txt)"
          KEY_PASSWORD="$(sed -n 's/^YTSC_KEY_PASSWORD=//p' internal-ytsc-release-key.txt)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          export YTSC_KEYSTORE_PATH="$GITHUB_WORKSPACE/internal-ytsc-release.jks"
          export YTSC_KEYSTORE_PASSWORD="$STORE_PASSWORD"
          export YTSC_KEY_ALIAS="$KEY_ALIAS"
          export YTSC_KEY_PASSWORD="$KEY_PASSWORD"

          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify update-compatible APK
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS_APK_NAME" \
            | tee previous-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" \
            | tee new-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' new-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' new-signature.txt

          PREVIOUS_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' previous-signature.txt | head -n 1)"
          NEW_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' new-signature.txt | head -n 1)"
          test -n "$PREVIOUS_CERT"
          test "$PREVIOUS_CERT" = "$NEW_CERT"

          "$AAPT" dump badging "$APK_NAME" > apk-badging.txt
          grep -q "package: name='$APK_PACKAGE'" apk-badging.txt
          grep -q "versionCode='$APK_VERSION_CODE'" apk-badging.txt
          grep -q "versionName='$APK_VERSION_NAME'" apk-badging.txt
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" > "$CHECKSUM_NAME"

      - name: Prepare release notes and source archive
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git archive --format=zip --output="$SOURCE_NAME" "$RELEASE_TARGET_SHA"
          cat > release-notes.md <<'EOF'
          v1.3.7은 전사 완료 후 스크립트를 선택 앱에 텍스트로 공유하는 흐름을 도입하고, 삼성 One UI에서 공유창 아래에 전사 앱 설정 화면이 노출되는 문제까지 수정합니다.

          - 완료 알림은 `확인`과 `앱 공유` 두 버튼을 유지합니다.
          - `앱 공유`는 `ACTION_SEND`와 `text/plain`으로 전체 스크립트를 전달합니다.
          - 선택한 공유 앱을 기억하거나 사용할 때마다 Android 공유창에서 선택할 수 있습니다.
          - `사용할 때마다 선택` 모드에서는 추가 버튼 없이 공유창을 즉시 표시합니다.
          - 공유 전용 투명 Activity와 설정 Activity를 분리해 현재 사용 중인 화면이 공유창 배경으로 유지됩니다.
          - 클립보드 포커스 제한을 고려해 창 포커스 확보 후 재시도합니다.
          - 패키지명과 정식 서명 인증서를 유지하고 versionCode를 14로 올려 기존 설치본 위에 업데이트할 수 있습니다.
          EOF

      - name: Create GitHub release
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$APK_NAME" "$CHECKSUM_NAME" "$SOURCE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "YouTube Script Copy 1.3.7" \
            --notes-file release-notes.md

      - name: Read back and verify release
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          rm -rf /tmp/release-readback
          mkdir -p /tmp/release-readback
          cd /tmp/release-readback
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CHECKSUM_NAME"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_NAME"
          sha256sum --check --strict "$CHECKSUM_NAME"
          unzip -t "$SOURCE_NAME" >/dev/null

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" \
            | tee "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          grep -q 'Verified using v1 scheme (JAR signing): true' \
            "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$GITHUB_WORKSPACE/apk-signature-readback.txt"
          "$AAPT" dump badging "$APK_NAME" > "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "package: name='$APK_PACKAGE'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "versionCode='$APK_VERSION_CODE'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          grep -q "versionName='$APK_VERSION_NAME'" "$GITHUB_WORKSPACE/apk-badging-readback.txt"
          unzip -t "$APK_NAME" >/dev/null

          cp "$APK_NAME" "$GITHUB_WORKSPACE/$APK_NAME"
          cp "$CHECKSUM_NAME" "$GITHUB_WORKSPACE/$CHECKSUM_NAME"
          cp "$SOURCE_NAME" "$GITHUB_WORKSPACE/$SOURCE_NAME"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url \
            > "$GITHUB_WORKSPACE/release-readback.json"

      - name: Remove temporary inspection branches
        if: steps.release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          for branch in \
            tmp-release-inspection \
            tmp-release-inspection-2 \
            tmp-release-inspection-3 \
            tmp-release-inspection-4 \
            tmp-release-inspection-5 \
            tmp-release-inspection-6 \
            tmp-release-inspection-7; do
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          done

      - name: Remove signing credentials
        if: always() && steps.release.outputs.exists == 'false'
        run: |
          rm -f internal-ytsc-release.jks internal-ytsc-release-key.txt

      - name: Upload verified release evidence
        if: steps.release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeScriptCopy-1.3.7-release
          path: |
            YouTubeScriptCopy-1.3.7.apk
            YouTubeScriptCopy-1.3.7.sha256
            apk-signature-readback.txt
            apk-badging-readback.txt
            release-readback.json
            youtube-script-copy-android-v1.3.7-source.zip
          if-no-files-found: error
          retention-days: 30
